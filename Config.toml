[server]
# Serves ./static at /app/static (needed for the PWA manifest, icons, service worker)
enableStaticServing = true

[client]
# Hides the Deploy button and main menu for regular visitors
toolbarMode = "viewer"

[theme]
primaryColor = "#0b2545"
backgroundColor = "#f5f7fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2937"
font = "sans serif"